<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transcript, Wiki & Quest Query</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f8f8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .results-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
        }

        .results-column {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fafafa;
        }

        .results-column h2 {
            text-align: center;
            color: #007BFF;
        }

        .result-item {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eaeaea;
        }

        .result-item h3 {
            margin: 0;
            font-size: 18px;
            color: #007BFF;
        }

        .result-item p {
            margin: 5px 0;
            color: #555;
        }

        .error {
            color: red;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Transcript, Wiki & Quest Query</h1>
        <input type="text" id="questionInput" placeholder="Enter your question" />
        <button id="queryButton">Search</button>
        <div id="error" class="error"></div>
        <div id="results-container" class="results-container">
            <div id="transcriptResults" class="results-column">
                <h2>Transcript Results</h2>
            </div>
            <div id="wikiResults" class="results-column">
                <h2>Wiki Page Results</h2>
            </div>
            <div id="questResults" class="results-column">
                <h2>Quest Results</h2>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('queryButton').addEventListener('click', async () => {
            const question = document.getElementById('questionInput').value.trim();
            const transcriptResultsDiv = document.getElementById('transcriptResults');
            const wikiResultsDiv = document.getElementById('wikiResults');
            const questResultsDiv = document.getElementById('questResults');
            const errorDiv = document.getElementById('error');

            transcriptResultsDiv.innerHTML = '<h2>Transcript Results</h2>';
            wikiResultsDiv.innerHTML = '<h2>Wiki Page Results</h2>';
            questResultsDiv.innerHTML = '<h2>Quest Results</h2>';
            errorDiv.textContent = '';

            if (!question) {
                errorDiv.textContent = 'Please enter a question.';
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/query?question=${encodeURIComponent(question)}`);
                if (!response.ok) {
                    throw new Error('Error fetching data from API');
                }
                const data = await response.json();

                // Display transcript results
                if (data.transcriptResults && data.transcriptResults.length > 0) {
                    data.transcriptResults.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.classList.add('result-item');

                        const title = document.createElement('h3');
                        title.textContent = item.title;
                        itemDiv.appendChild(title);

                        const youtubeLink = document.createElement('a');
                        youtubeLink.href = item.youtube_url;
                        youtubeLink.textContent = "Watch on YouTube";
                        youtubeLink.target = "_blank";
                        itemDiv.appendChild(youtubeLink);

                        const chunkText = document.createElement('p');
                        chunkText.textContent = item.chunk_text;
                        itemDiv.appendChild(chunkText);

                        const relevance = document.createElement('p');
                        relevance.textContent = "Relevance Score: " + item.relevance.toFixed(4);
                        itemDiv.appendChild(relevance);

                        transcriptResultsDiv.appendChild(itemDiv);
                    });
                } else {
                    transcriptResultsDiv.innerHTML += '<p>No transcript results found.</p>';
                }

                // Display wiki results
                if (data.wikiResults && data.wikiResults.length > 0) {
                    data.wikiResults.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.classList.add('result-item');

                        const title = document.createElement('h3');
                        title.textContent = item.title;
                        itemDiv.appendChild(title);

                        if (item.wiki_url) {
                            const wikiLink = document.createElement('a');
                            wikiLink.href = item.wiki_url;
                            wikiLink.textContent = "Read on Wikipedia";
                            wikiLink.target = "_blank";
                            itemDiv.appendChild(wikiLink);
                        }

                        const chunkText = document.createElement('p');
                        chunkText.textContent = item.chunk_text;
                        itemDiv.appendChild(chunkText);

                        const relevance = document.createElement('p');
                        relevance.textContent = "Relevance Score: " + item.relevance.toFixed(4);
                        itemDiv.appendChild(relevance);

                        wikiResultsDiv.appendChild(itemDiv);
                    });
                } else {
                    wikiResultsDiv.innerHTML += '<p>No wiki page results found.</p>';
                }

                // Display quest results
                if (data.questResults && data.questResults.length > 0) {
                    data.questResults.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.classList.add('result-item');

                        const title = document.createElement('h3');
                        title.textContent = item.title;
                        itemDiv.appendChild(title);

                        if (item.description) {
                            const description = document.createElement('p');
                            description.textContent = item.description;
                            itemDiv.appendChild(description);
                        }

                        const chunkText = document.createElement('p');
                        chunkText.textContent = item.chunk_text;
                        itemDiv.appendChild(chunkText);

                        const relevance = document.createElement('p');
                        relevance.textContent = "Relevance Score: " + item.relevance.toFixed(4);
                        itemDiv.appendChild(relevance);

                        questResultsDiv.appendChild(itemDiv);
                    });
                } else {
                    questResultsDiv.innerHTML += '<p>No quest results found.</p>';
                }
            } catch (err) {
                errorDiv.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>

</html>
