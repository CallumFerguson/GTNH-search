<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transcript Query</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f8f8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }

        .result-item {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eaeaea;
        }

        .result-item h2 {
            margin: 0;
            font-size: 20px;
            color: #007BFF;
        }

        .result-item p {
            margin: 5px 0;
            color: #555;
        }

        .error {
            color: red;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Transcript Query</h1>
        <input type="text" id="questionInput" placeholder="Enter your question" />
        <button id="queryButton">Search</button>
        <div id="results" class="result"></div>
        <div id="error" class="error"></div>
    </div>
    <script>
        document.getElementById('queryButton').addEventListener('click', async () => {
            const question = document.getElementById('questionInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const errorDiv = document.getElementById('error');
            resultsDiv.innerHTML = '';
            errorDiv.textContent = '';

            if (!question) {
                errorDiv.textContent = 'Please enter a question.';
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/query?question=${encodeURIComponent(question)}`);
                if (!response.ok) {
                    throw new Error('Error fetching data from API');
                }
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    data.results.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.classList.add('result-item');
                        const title = document.createElement('h2');
                        title.textContent = item.title;
                        const youtubeLink = document.createElement('a');
                        youtubeLink.href = item.youtube_url;
                        youtubeLink.textContent = "Watch on YouTube";
                        youtubeLink.target = "_blank";
                        const chunkText = document.createElement('p');
                        chunkText.textContent = item.chunk_text;
                        const relevance = document.createElement('p');
                        relevance.textContent = "Relevance Score: " + item.relevance.toFixed(4);
                        itemDiv.appendChild(title);
                        itemDiv.appendChild(youtubeLink);
                        itemDiv.appendChild(chunkText);
                        itemDiv.appendChild(relevance);
                        resultsDiv.appendChild(itemDiv);
                    });
                } else {
                    resultsDiv.innerHTML = '<p>No results found.</p>';
                }
            } catch (err) {
                errorDiv.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>

</html>
